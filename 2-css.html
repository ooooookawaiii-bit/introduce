<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나를 소개합니다 💕</title>
    <style>
        /* 기본 리셋 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --pink-deep: #ff1493;
            --pink-vivid: #ff3385;
            --pink-main: #ff66a3;
            --pink-soft: #ffb3d1;
            --pink-light: #fff0f5;
            --pink-bg: #ffe4ee;
            --black-frill: #0e0d13;
            --black-soft: #24212a;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
            background: radial-gradient(circle at 50% 20%, #ffa3c7 0%, #ff6699 45%, #e60067 100%);
            min-height: 100vh;
            padding: 50px 16px 80px 16px;
            color: #2b1f28;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* 배경 검은 레이스 / 격자망 패턴 오버레이 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(rgba(14, 13, 19, 0.18) 1.5px, transparent 1.5px),
                linear-gradient(45deg, rgba(14, 13, 19, 0.05) 25%, transparent 25%, transparent 75%, rgba(14, 13, 19, 0.05) 75%),
                linear-gradient(-45deg, rgba(14, 13, 19, 0.05) 25%, transparent 25%, transparent 75%, rgba(14, 13, 19, 0.05) 75%);
            background-size: 24px 24px, 32px 32px, 32px 32px;
            pointer-events: none;
            z-index: 0;
        }

        /* 화면 상단/하단 다층 검은 프릴 (Ruffles) */
        .frill-curtain-top, .frill-curtain-bottom {
            position: fixed;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .frill-curtain-top {
            top: 0;
        }

        .frill-curtain-bottom {
            bottom: 0;
            transform: rotate(180deg);
        }

        /* 프릴 레이스 SVG 스타일 */
        .frill-svg-layer {
            display: block;
            width: 100%;
            height: 38px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.45));
        }

        .frill-svg-sub {
            display: block;
            width: 100%;
            height: 26px;
            margin-top: -10px;
            opacity: 0.9;
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.35));
        }

        /* 배경 떠다니는 하트/리본 장식 */
        .bg-deco {
            position: fixed;
            font-size: 1.6rem;
            color: rgba(255, 255, 255, 0.7);
            user-select: none;
            pointer-events: none;
            z-index: 1;
            filter: drop-shadow(0 2px 5px rgba(255, 20, 147, 0.5));
            animation: floatDeco 4s ease-in-out infinite alternate;
        }

        .bg-deco-1 { top: 12%; left: 8%; animation-delay: 0s; font-size: 2.2rem; }
        .bg-deco-2 { top: 22%; right: 7%; animation-delay: 1.2s; font-size: 1.8rem; }
        .bg-deco-3 { bottom: 18%; left: 6%; animation-delay: 2.1s; font-size: 2rem; }
        .bg-deco-4 { bottom: 25%; right: 9%; animation-delay: 0.7s; font-size: 2.4rem; }

        @keyframes floatDeco {
            0% { transform: translateY(0) rotate(-6deg); }
            100% { transform: translateY(-16px) rotate(8deg); }
        }

        /* 전체 카드 래퍼 (주변 검은 프릴 테두리를 위한 부모) */
        .card-wrapper {
            position: relative;
            width: 100%;
            max-width: 520px;
            z-index: 2;
            padding: 18px 0;
        }

        /* 메인 카드 주변을 감싸는 검은 프릴 리본 테두리 */
        .card-frill-border-top,
        .card-frill-border-bottom {
            width: 100%;
            height: 28px;
            display: block;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
        }

        .card-frill-border-bottom {
            transform: rotate(180deg);
            margin-top: -4px;
        }

        .card-frill-border-top {
            margin-bottom: -4px;
        }

        /* 메인 프로필 카드 */
        .container {
            background: linear-gradient(165deg, #ffffff 0%, #fff4f8 40%, #ffe9f2 100%);
            border: 4px solid var(--black-frill);
            outline: 2px dashed var(--pink-deep);
            outline-offset: -8px;
            border-radius: 32px;
            padding: 38px 24px;
            box-shadow: 
                0 0 0 6px #fff,
                0 0 0 10px var(--pink-vivid),
                0 20px 45px rgba(26, 0, 16, 0.35);
            position: relative;
        }

        /* 상단 타이틀 & 리본 */
        .header-title-box {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
        }

        .ribbon-icon {
            display: inline-block;
            font-size: 1.8rem;
            margin-bottom: 4px;
            animation: pulseRibbon 2s infinite ease-in-out;
        }

        @keyframes pulseRibbon {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15) rotate(3deg); }
        }

        h1 {
            font-size: 1.65rem;
            color: #1a0011;
            text-shadow: 2px 2px 0px #ffccd9, 0 0 10px rgba(255, 51, 133, 0.4);
            letter-spacing: -0.5px;
            word-break: keep-all;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* 섹션 공통 카드 (검은 프릴 레이스 테두리 감성) */
        .card-section {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 20px 18px;
            margin-bottom: 18px;
            border: 2px solid var(--black-frill);
            box-shadow: 4px 4px 0px rgba(255, 20, 147, 0.7);
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card-section:hover {
            transform: translateY(-2px);
            box-shadow: 6px 6px 0px var(--black-frill);
        }

        /* 섹션별 은은한 핑크 톤 */
        .section-photo {
            text-align: center;
            background: linear-gradient(145deg, #fffafd 0%, #fff0f6 100%);
            border-color: var(--black-frill);
        }

        .section-info {
            background: #fff8fb;
        }

        .section-likes {
            background: #fff5f9;
        }

        .section-dream {
            background: #fff9fc;
        }

        .section-message {
            background: #fff0f7;
            margin-bottom: 0;
        }

        /* 섹션 소제목 */
        h2 {
            font-size: 1.15rem;
            color: var(--black-frill);
            margin-bottom: 12px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        h2::before {
            content: "✦";
            color: var(--pink-deep);
            font-size: 1.1rem;
        }

        /* 사진 영역: 화려한 고딕 핑크 & 블랙 프릴 프레임 */
        .photo-frame-container {
            position: relative;
            display: inline-block;
            margin: 10px auto 14px auto;
        }

        /* 사진 둘레를 감싸는 검은 프릴 원형 링 */
        .photo-frill-ring {
            width: 230px;
            height: 230px;
            border-radius: 50%;
            background: repeating-conic-gradient(
                var(--black-frill) 0% 2.5%,
                #ff66a3 2.5% 5%
            );
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                0 0 0 4px var(--pink-vivid),
                0 8px 24px rgba(0, 0, 0, 0.35);
            position: relative;
        }

        /* 프릴 느낌의 스캘럽 톱니 테두리 */
        .photo-frill-ring::before {
            content: "";
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            border: 4px dotted var(--black-frill);
            pointer-events: none;
        }

        /* 실제 얼굴 사진 */
        .photo-frame-container img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            object-position: 25% center; /* 마도카 & 호무라 얼굴 중심 포커스 */
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
            display: block;
        }

        /* 사진 밑 귀여운 리본 뱃지 */
        .photo-badge {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--black-frill);
            color: #ffccd9;
            font-size: 0.8rem;
            font-weight: bold;
            padding: 4px 14px;
            border-radius: 12px;
            border: 1.5px solid var(--pink-deep);
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .photo-caption {
            font-size: 0.85rem;
            color: #7a586d;
            margin-top: 10px;
        }

        /* 텍스트 단락 */
        p {
            font-size: 1rem;
            line-height: 1.65;
            color: #382531;
            word-break: keep-all;
        }

        p strong {
            color: var(--black-frill);
            background: linear-gradient(120deg, #ffccd9 0%, #ff9ebb 100%);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #ff6699;
        }

        /* 좋아하는 것 3가지 목록 */
        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        li {
            background: linear-gradient(90deg, #ffffff 0%, #fff0f6 100%);
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 0.98rem;
            font-weight: 600;
            color: #1a0011;
            border: 1.5px solid var(--black-frill);
            box-shadow: 2px 2px 0px var(--pink-deep);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        li:hover {
            transform: translateX(4px);
            background: #ffe4f0;
        }

        li .item-icon {
            font-size: 1.25rem;
        }

        /* 모바일 반응형 */
        @media (max-width: 480px) {
            body {
                padding: 40px 12px 60px 12px;
            }

            .container {
                padding: 28px 16px;
                border-radius: 26px;
            }

            h1 {
                font-size: 1.4rem;
            }

            .photo-frill-ring {
                width: 190px;
                height: 190px;
            }

            .photo-frame-container img {
                width: 165px;
                height: 165px;
            }

            .card-section {
                padding: 16px 14px;
            }

            h2 {
                font-size: 1.05rem;
            }

            p, li {
                font-size: 0.92rem;
            }
        }
    </style>
