<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나를 소개합니다</title>
</head>
<body>
    <h1>👋 안녕하세요! 저를 소개합니다</h1>

    <hr>

    <!-- 사진 넣을 자리 -->
    <h2>내 사진</h2>
    <img src="https://via.placeholder.com/200" alt="내 사진 자리" width="200" height="200">
    <p><em>(나중에 원하는 사진 파일의 경로로 src 속성을 바꿔보세요!)</em></p>

    <hr>

    <!-- 기본 정보 / 이름 -->
    <h2>내 이름</h2>
    <p><strong>이름:</strong> 김나비</p>

    <hr>

    <!-- 좋아하는 것 3가지 -->
    <h2>내가 좋아하는 것 3가지</h2>
    <ul>
        <li>음악 감상하기 🎧</li>
        <li>맛있는 디저트 먹기 🍰</li>
        <li>친구들과 산책하며 대화하기 🌳</li>
    </ul>

    <hr>

    <!-- 내 꿈 -->
    <h2>나의 꿈</h2>
    <p>사람들에게 행복과 긍정적인 에너지를 주는 멋진 크리에이터가 되는 것입니다!</p>

    <hr>

    <h2>친구들에게 한마디</h2>
    <p>만나서 정말 반가워요! 앞으로 우리 더 친하게 지내요 😊</p>
</body>
</html>
